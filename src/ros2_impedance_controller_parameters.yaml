ros2_impedance_controller:
  joints: {
    type: string_array,
    default_value: [],
    description: "Name of the joints to control.",
  }
  base_link: {
    type: string,
    default_value: "",
    description: "Name of the link used for kinematic reference.",
  }
  interaction_link: {
    type: string,
    default_value: "",
    description: "Name of the link used for interaction port, usually is the robot end effector.",
  }
  ft_sensor_topic: {
    type: string,
    default_value: "",
    description: "Force-torque sensor topic name",
  }
  degrees_of_freedom: {
    type: int,
    default_value: 6,
    description: "Expected degrees of freedom (joints) between the base_link and the interaction_link.
    It is updated according the parsed URDF.",
  }
  stiffness: {
    type: double_array,
    default_value: [1000.0, 1000.0, 1000.0, 300.0, 300.0, 300.0],
    description: "Cartesian stiffness gains [N/m, N/m, N/m, Nm/rad, Nm/rad, Nm/rad]",
  }
  damping: {
    type: double_array,
    default_value: [],
    description: "Cartesian damping gains [N.s/m, N.s/m, N.s/m, Nm.s/rad, Nm.s/rad, Nm.s/rad]",
  }
  taskspace_mass: {
    type: double,
    default_value: 10.58345,
    description: "Desired Cartesian mass. This value defines m_x, m_y, and m_z,
    since the translational part of the generalized inertia matrix must be the same.
    The inertia tensor (rotational part) is of a solid sphere with this mass, and
    radius 0.5 m.",
  }
  visualize_reference: {
    type: bool,
    default_value: true,
    read_only: true,
  }
