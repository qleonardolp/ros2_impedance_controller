impedance_controller:
  ros__parameters:
    type: ros2_impedance_controller/ImpedanceController
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    base_link: base_link
    interaction_link: ee_link
    ft_sensor_topic: end_effector_ft_sensor
    stiffness: [800.0, 800.0, 800.0, 120.0, 120.0, 120.0]
    taskspace_mass: 10.0
    # stiffness: [196.0, 196.0, 196.0, 18.0, 18.0, 18.0]
    # damping: [28.0, 28.0, 28.0, 8.48, 8.48, 8.48]
    # taskspace_mass: 0.0
    torque_cutoff: 20.0
