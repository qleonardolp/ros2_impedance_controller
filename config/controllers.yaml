controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    thread_priority: 98  # Range: 0-99. Default is 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diagnostics:
      threshold:
        controllers:
          execution_time:  # refers to controller's update cycle execution time in us
            mean_error:
              warn: 1000.0
              error: 2000.0
            standard_deviation:
              warn: 100.0
              error: 200.0

impedance_controller:
  ros__parameters:
    type: ros2_impedance_controller/ImpedanceController
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    base_link: base_link
    interaction_link: ee_link
    ft_sensor_topic: end_effector_ft_sensor
    stiffness: [1000.0, 1000.0, 1000.0, 300.0, 300.0, 300.0]
#    damping: [83.0, 83.0, 83.0, 1.7, 1.7, 1.7]
    taskspace_mass: 0.0 # 10.58345
    visualize_reference: false

forward_effort_controller:
  ros__parameters:
    type: forward_command_controller/ForwardCommandController
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: effort
